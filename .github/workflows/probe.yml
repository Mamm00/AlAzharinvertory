name: probe
# TEMPORARY diagnostic workflow — deleted once the Pages settings are repaired.
on:
  push:
    branches: [arena/9e7effe4-alazharinvertory]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Can the workflow token dispatch the pages workflow on the allowed ref?
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          OUT=/tmp/probe.txt
          : > "$OUT"
          {
            echo "== dispatch pages.yml on arena/d9362531-alazharinvertory =="
            gh workflow run pages.yml --ref arena/d9362531-alazharinvertory -R "${{ github.repository }}" 2>&1 || true
            echo "exit=$?"
            sleep 10
            echo "== recent runs =="
            gh run list --limit 5 2>&1 || true
          } >> "$OUT"
          cat "$OUT"
          gh api -X POST "repos/${{ github.repository }}/issues" \
            -f title="CI probe dispatch ${{ github.sha }}" \
            -f body="$(cat "$OUT")" 2>&1 || echo "issue create failed"

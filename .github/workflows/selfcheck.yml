name: selfcheck
# TEMPORARY: exercises the exact images/inputs the new pages.yml uses, on a
# branch that can run without the github-pages environment.
on:
  push:
    branches: [arena/9e7effe4-alazharinvertory]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python --version && node --version && npm --version
      - run: python -m pip install --quiet pillow
      - run: npm ci --no-audit --no-fund
      - run: python3 tools/build_app.py --check && python3 tools/build_site.py --check
      - run: node test.js
      - run: node test-ui.js
      - run: node test-site.js
      - run: node lint.js

  deploy-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
      - name: Preflight output (expected to fail on a legacy site)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cfg=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null || true)
          if [ -z "$cfg" ]; then
            echo "::error::GitHub Pages is not enabled for this repository."
            exit 1
          fi
          build_type=$(printf '%s' "$cfg" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_type",""))')
          echo "Pages build_type: $build_type"
          if [ "$build_type" != "workflow" ]; then
            src=$(printf '%s' "$cfg" | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("source") or {}; print(s.get("branch","?")+s.get("path",""))')
            echo "::error::Pages serves '$build_type' from branch $src — artifact ignored."
            exit 1
          fi
      - name: Artifact contents (does .nojekyll survive?)
        run: |
          gh run download --repo "$GITHUB_REPOSITORY" --name github-pages --dir /tmp/art 2>/dev/null || true
          ls -a /tmp/art 2>/dev/null | head || echo "(download needs the run to be finished)"

name: cleanup
# TEMPORARY: closes the diagnostic issues the probe workflow opened. Deleted
# in the next commit; the workflow token can close issues, the app token cannot.
on:
  push:
    branches: [arena/9e7effe4-alazharinvertory]

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in 3 4 5 6; do
            gh issue close "$n" -c "Diagnostic complete. Root cause: Pages was left in **Deploy from a branch** mode pinned to a stale work branch, and the \`github-pages\` environment only allows that branch — so every deploy from \`main\` is refused before it starts. No token available inside CI can change either setting; the fix is one dropdown in Settings, documented in the PR." && echo "closed $n" || echo "could not close $n"
          done

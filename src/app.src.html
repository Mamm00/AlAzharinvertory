<!DOCTYPE html>
<!--
  ============================================================================
  AL AZHAR TEX  ·  FABRIC ROLL INVENTORY
  multi-warehouse fabric roll stock control (single file, offline, bilingual)
  ============================================================================
  Single-file application: HTML + CSS + JavaScript, all inline.
  • No build step, no framework, no npm, no server, ZERO CDN/network calls.
  • Runs from file:// (double-click) AND from a GitHub Pages subpath.
  • Persistence: window.localStorage (auto-save on every committed change).
  • Auth + RBAC: 100% client-side, demo-grade (see the security note in the
    in-app README view — client-side RBAC is NOT tamper-proof).
  • Charts: hand-drawn inline SVG. No chart library.
  • All UI strings go through t(key) with a full EN + AR dictionary; Arabic
    switches <html dir="rtl" lang="ar"> and mirrors the layout via CSS
    logical properties (no separate RTL stylesheet to keep in sync).
  ============================================================================
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
  Content-Security-Policy.
  'unsafe-inline' is REQUIRED here because this is deliberately a single-file
  app: the stylesheet and the script are inline by definition. If you ever move
  to a multi-file build, drop 'unsafe-inline' and reference external files.
  There is no external origin in this policy at all, so the app cannot phone
  home even if a name/notes field is injected with markup.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">

<!--
  <base href="./"> makes every URL in the document resolve relative to the
  folder that contains index.html, which is exactly what GitHub Pages needs at
  https://<user>.github.io/<repo>/ and is harmless on file://.
-->
<base href="./">

<title>Al Azhar Tex — Fabric Roll Inventory · Multi-warehouse stock control</title>
<!-- The favicon is the brand mark, inlined as a data: URI so it works on file:// and
     offline. It is the SAME geometry the app renders (see tools/make_logo.py). -->
<!--@FAVICON-->

<style>
/* ==========================================================================
   1. DESIGN TOKENS
   ========================================================================== */
:root{
  /* Al Azhar Tex brand palette — sampled from the supplied logo artwork. */
  --navy:#222457;
  --navy-2:#2E3168;
  --brand-red:#CB3632;
  --navy-3:#41458F;
  --slate:#334155;
  --slate-2:#54637a;
  --slate-3:#8494a8;
  --teal:#14B8A6;
  --teal-dark:#0f8377;
  --bg:#F1F5F9;
  --card:#ffffff;
  --line:#dbe3ec;
  --line-2:#eaeff5;
  --red:#DC2626;
  --red-bg:#fdecec;
  --amber:#B45309;
  --amber-bg:#fdf3df;
  --blue:#1D4ED8;
  --blue-bg:#e8effd;
  --green:#15803D;
  --green-bg:#e6f6ea;
  --grey-bg:#eef1f5;
  --shadow:0 1px 2px rgba(15,42,68,.06),0 4px 14px rgba(15,42,68,.07);
  --radius:12px;
  --sidebar-w:242px;
  --topbar-h:60px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Noto Kufi Arabic",Tahoma,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}

/* ==========================================================================
   2. RESET + BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  font-size:14px;line-height:1.5;
  color:var(--slate);
  background:var(--bg);
  min-height:100vh;
}
[hidden]{display:none !important}
h1,h2,h3,h4{margin:0;font-weight:650;color:var(--navy);line-height:1.25}
h1{font-size:21px}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0 0 10px}
ul,ol{margin:0 0 10px;padding-inline-start:22px}
li{margin:0 0 4px}
a{color:var(--teal-dark)}
small{font-size:12px}
code,kbd{font-family:var(--mono);font-size:12px;background:var(--grey-bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
:focus-visible{outline:3px solid rgba(34,36,87,.62);outline-offset:2px;border-radius:4px}
[lang="ar"] body,body[dir] {letter-spacing:0}
::selection{background:rgba(34,36,87,.18)}

/* ==========================================================================
   3. LAYOUT
   ========================================================================== */
#app{display:block}
.layout{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--navy);color:#dbe6f1;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  border-inline-end:1px solid #15173c;
}
.sidebar .brand{
  display:flex;gap:10px;align-items:center;
  padding:14px 14px 12px;border-bottom:1px solid #15173c;
}
.sidebar .brand svg{flex:0 0 30px;color:#fff}
.sidebar .brand b{color:#fff;font-size:14px;display:block;letter-spacing:.2px}
.sidebar .brand span{display:block;font-size:11px;color:#8fb0cd}
.nav{padding:8px 8px 12px;overflow-y:auto;flex:1 1 auto}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:#7fa0bd;padding:10px 8px 5px}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;
  background:none;border:0;color:#dbe6f1;font:inherit;font-size:13.5px;
  text-align:start;padding:9px 9px;border-radius:8px;cursor:pointer;
  margin:1px 0;
}
.nav button:hover{background:var(--navy-2);color:#fff}
.nav button[aria-current="page"]{background:var(--navy-2);color:#fff;font-weight:650;box-shadow:inset 3px 0 0 var(--brand-red)}
[dir="rtl"] .nav button[aria-current="page"]{box-shadow:inset -3px 0 0 var(--brand-red)}
.nav button .ico{width:16px;text-align:center;flex:0 0 16px;opacity:.95}
.nav button .cnt{
  margin-inline-start:auto;font-size:10.5px;background:rgba(255,255,255,.16);
  border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums;color:#fff
}
.nav button[aria-current="page"] .cnt{background:rgba(4,36,31,.2);color:#04241f}
.sidebar-foot{padding:10px 12px;border-top:1px solid #15173c;font-size:11px;color:#8fb0cd}

.main-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:var(--topbar-h);position:sticky;top:0;z-index:40;
  background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:0 16px;
}
.topbar .crumb{min-width:0}
.topbar .crumb b{display:block;font-size:15px;color:var(--navy)}
.topbar .crumb span{display:block;font-size:11.5px;color:var(--slate-2)}
.topbar .spacer{flex:1 1 auto}
.who{display:flex;align-items:center;gap:8px;padding-inline-start:6px;border-inline-start:1px solid var(--line)}
.who .av{
  width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 32px
}
.who .nm2{font-size:12.5px;font-weight:650;color:var(--navy);line-height:1.15}
.who .rl{font-size:11px;color:var(--slate-2)}
main.content{padding:16px;flex:1 1 auto;min-width:0}
.view{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ==========================================================================
   4. CARDS / GRID
   ========================================================================== */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 16px;margin:0 0 14px
}
.card > .card-h{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin:-14px -16px 12px;padding:12px 16px;border-bottom:1px solid var(--line-2);
  border-radius:var(--radius) var(--radius) 0 0;background:#fbfcfe
}
.card-h h2,.card-h h3{font-size:15px}
.card-h .spacer{flex:1 1 auto}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--slate-2)}
.tiny{font-size:11.5px}
.strong{font-weight:650}
.nowrap{white-space:nowrap}
.center{text-align:center}
.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
[dir="rtl"] .num{text-align:end}
.mt0{margin-top:0}.mb0{margin-bottom:0}

/* ==========================================================================
   5. BUTTONS + CONTROLS
   ========================================================================== */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font:inherit;font-size:13px;font-weight:600;
  color:var(--navy);background:#fff;
  border:1px solid var(--line);border-radius:9px;
  padding:7px 12px;cursor:pointer;white-space:nowrap;
  transition:background .12s,border-color .12s,transform .05s
}
.btn:hover{background:#f3f7fb;border-color:#c3d2e2}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--navy);border-color:#15173c;color:#fff}
.btn-primary:hover{background:var(--navy-2);border-color:#15173c}
.btn-navy{background:var(--navy);border-color:#15173c;color:#fff}
.btn-navy:hover{background:var(--navy-2)}
.btn-danger{background:#fff;border-color:#f0b6b6;color:#9d1c1c}
.btn-danger:hover{background:var(--red-bg)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--slate-2)}
.btn-ghost:hover{background:#eef2f7;color:var(--navy)}
.btn-sm{padding:4px 8px;font-size:12px;border-radius:7px}
.btn-xs{padding:2px 7px;font-size:11.5px;border-radius:6px;font-weight:600}
.btn-icon{padding:4px 7px}
.linkbtn{background:none;border:0;color:var(--teal-dark);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > label,.field > .lbl{font-size:11.5px;font-weight:650;color:var(--slate-2);letter-spacing:.2px}
.field .req{color:var(--red)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  font:inherit;font-size:13.5px;color:var(--slate);
  background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;width:100%;min-width:0;
}
textarea{resize:vertical;min-height:58px}
input:focus,select:focus,textarea:focus{border-color:var(--navy-3,#41458f);outline:none;box-shadow:0 0 0 3px rgba(34,36,87,.16)}
input[disabled],select[disabled],textarea[disabled]{background:var(--grey-bg);color:var(--slate-3);cursor:not-allowed}
select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  padding-inline-end:26px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M0 0h10L5 7z' fill='%2354637a'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;background-position-x:right 9px;background-position-y:center
}
[dir="rtl"] select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M0 0h10L5 7z' fill='%2354637a'/></svg>");
  background-position:left 9px center
}
select.inactive-opt{color:var(--slate-3);font-style:italic}
.err{color:#9d1c1c;font-size:12px;font-weight:600;display:none;align-items:center;gap:5px}
.err.show{display:flex}
.hint{color:var(--slate-3);font-size:11.5px}
input[type=number]{font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;padding-top:18px}
.check input{width:15px;height:15px;accent-color:var(--teal-dark);cursor:pointer}
.colorswatch{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);padding:0;background:transparent;cursor:pointer}
input[type=color]{width:34px;height:34px;padding:1px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}

/* segmented control */
.seg{display:inline-flex;background:var(--grey-bg);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{
  border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--slate-2);
  padding:5px 11px;border-radius:7px;cursor:pointer
}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(15,42,68,.14)}

/* language switch */
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.langsw button{
  border:0;background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:var(--slate-2);
  padding:6px 11px;cursor:pointer
}
.langsw button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* tabs (Masters) */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 14px}
.tabs button{
  border:1px solid transparent;border-bottom:0;background:none;font:inherit;
  font-size:13.5px;font-weight:650;color:var(--slate-2);
  padding:8px 14px;border-radius:9px 9px 0 0;cursor:pointer;margin-bottom:-1px
}
.tabs button:hover{color:var(--navy);background:#f6f9fc}
.tabs button[aria-selected="true"]{background:#fff;border-color:var(--line);color:var(--navy);box-shadow:inset 0 2px 0 var(--brand-red)}
.tabs button .cnt{font-size:11px;color:var(--slate-3);font-weight:600}

/* ==========================================================================
   6. TABLES
   ========================================================================== */
.tbl-wrap{
  border:1px solid var(--line);border-radius:10px;background:#fff;
  overflow:auto;max-height:min(64vh,720px)
}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl caption{caption-side:top;text-align:start;padding:9px 11px;font-size:12px;color:var(--slate-2);background:#fbfcfe;border-bottom:1px solid var(--line-2)}
.tbl th,.tbl td{padding:7px 9px;border-bottom:1px solid var(--line-2);vertical-align:top;text-align:start}
.tbl thead th{
  position:sticky;top:0;z-index:6;
  background:var(--navy);color:#fff;font-size:11.5px;font-weight:650;
  letter-spacing:.35px;text-transform:uppercase;white-space:nowrap;
  border-bottom:1px solid #15173c
}
.tbl thead th:first-child{border-start-start-radius:0}
.tbl tbody tr:nth-child(even){background:#f8fafc}
.tbl tbody tr:hover{background:#eff6f8}
.tbl tbody tr.row-inactive{background:#f2f4f6;color:var(--slate-3);font-style:italic;opacity:.6}
.tbl tbody tr.row-invalid{background:var(--red-bg)}
.tbl tbody tr.row-flash{animation:flash 1.5s ease-out}
@keyframes flash{0%{background:#d6f5ef}100%{background:transparent}}
.tbl td .cell-invalid{background:var(--red);color:#fff;font-weight:700;padding:2px 6px;border-radius:6px;display:inline-block}
.tbl .col-x{white-space:nowrap}
.tbl.compact th,.tbl.compact td{padding:5px 7px;font-size:12.5px}
.tbl tfoot td{position:sticky;bottom:0;background:#eef2f7;font-weight:700;color:var(--navy);border-top:2px solid var(--line);z-index:5}
.empty{padding:26px 14px;text-align:center;color:var(--slate-3);font-size:13px;background:#fff}
.scroll-x{overflow-x:auto}

/* data bars on roll columns */
.bar{display:flex;align-items:center;gap:7px;justify-content:flex-end}
.bar .track{flex:0 0 54px;height:7px;background:var(--line-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--teal),#0d9488);border-radius:5px}
[dir="rtl"] .bar .fill{background:linear-gradient(270deg,var(--teal),#0d9488)}
.bar .v{font-variant-numeric:tabular-nums;font-weight:650}

/* chips + status */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;
  border:1px solid transparent;white-space:nowrap
}
.st-ok{background:var(--green-bg);color:var(--green);border-color:#b9e2c4}
.st-low{background:var(--amber-bg);color:var(--amber);border-color:#f0d9a8}
.st-over{background:var(--blue-bg);color:var(--blue);border-color:#c3d5f8}
.st-oos{background:var(--red);color:#fff;border-color:#b91c1c}
.grade-A{background:var(--green-bg);color:var(--green);border-color:#b9e2c4}
.grade-B{background:#fefce8;color:#854d0e;border-color:#f2e5a3}
.grade-C{background:#fff2e8;color:#c2410c;border-color:#f8d3b6}
.grade-D{background:var(--red-bg);color:#9d1c1c;border-color:#f3c2c2}
.dotsw{width:11px;height:11px;border-radius:3px;border:1px solid rgba(15,42,68,.28);display:inline-block;vertical-align:-1px}
.flag{font-size:11px;font-weight:700;color:#fff;background:var(--red);padding:1px 6px;border-radius:5px}
.flag-warn{background:#b45309}
.rolebadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#e8effd;color:var(--blue)}

/* utilisation */
.util{display:flex;align-items:center;gap:7px}
.util .gauge{width:64px;height:7px;border-radius:5px;background:var(--line-2);overflow:hidden}
.util .gauge i{display:block;height:100%;border-radius:5px}
.util-ok .gauge i{background:var(--green)}
.util-warn .gauge i{background:#d97706}
.util-bad .gauge i{background:var(--red)}
.util b{font-variant-numeric:tabular-nums;font-size:12.5px}
.util-ok b{color:var(--green)}.util-warn b{color:var(--amber)}.util-bad b{color:var(--red)}

/* ==========================================================================
   7. KPI CARDS
   ========================================================================== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px;margin:0 0 14px}
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden
}
.kpi::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--navy)}
.kpi.k-red::before{background:var(--red)}
.kpi.k-amber::before{background:#d97706}
.kpi.k-blue::before{background:var(--blue)}
.kpi.k-navy::before{background:var(--navy)}
.kpi .lb{font-size:11px;font-weight:650;color:var(--slate-2);text-transform:uppercase;letter-spacing:.4px}
.kpi .vv{font-size:22px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:3px}
.kpi .sub{font-size:11px;color:var(--slate-3)}

/* ==========================================================================
   8. TOASTS / BANNERS
   ========================================================================== */
#toastHost{
  position:fixed;inset-block-start:12px;inset-inline-end:14px;z-index:200;
  display:flex;flex-direction:column;gap:8px;width:min(390px,calc(100vw - 28px));
  pointer-events:none
}
.toast{
  pointer-events:auto;background:#fff;border:1px solid var(--line);
  border-inline-start-width:5px;border-radius:10px;box-shadow:0 8px 26px rgba(15,42,68,.16);
  padding:9px 11px;display:flex;gap:9px;align-items:flex-start;
  font-size:13px;animation:slidein .2s ease-out
}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.toast.ok{border-inline-start-color:var(--teal)}
.toast.err{border-inline-start-color:var(--red)}
.toast.warn{border-inline-start-color:#d97706}
.toast.info{border-inline-start-color:var(--blue)}
.toast .ic{font-size:15px;line-height:1.25}
.toast .tx{flex:1 1 auto;min-width:0}
.toast .tx b{display:block;color:var(--navy);font-size:12.5px}
.banner{
  border:1px solid var(--line);border-inline-start:5px solid var(--blue);
  background:#f7faff;border-radius:10px;padding:10px 13px;margin:0 0 13px;font-size:13px
}
.banner.warn{border-color:#f0d9a8;border-inline-start-color:#d97706;background:#fffaf0}
.banner.danger{border-color:#f3c2c2;border-inline-start-color:var(--red);background:#fff6f6}
.banner.ok{border-color:#b9e2c4;border-inline-start-color:var(--green);background:#f4fbf6}

/* ==========================================================================
   9. MODAL
   ========================================================================== */
.overlay{
  position:fixed;inset:0;background:rgba(11,25,40,.5);z-index:150;
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto
}
.modal{
  background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(4,18,32,.35);
  width:min(760px,100%);animation:pop .16s ease-out
}
.modal.narrow{width:min(470px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16px}
.modal-h .spacer{flex:1 1 auto}
.modal-b{padding:16px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:13px 16px;border-top:1px solid var(--line);background:#fbfcfe;border-radius:0 0 14px 14px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:11px}
.form-grid .span2{grid-column:1/-1}
.inline-note{font-size:11.5px;color:var(--slate-3);margin-top:2px}

/* ==========================================================================
   10. LOGIN
   ========================================================================== */
#loginScreen{
  min-height:100vh;display:grid;place-items:center;padding:22px;
  background:radial-gradient(1100px 560px at 50% -8%,#1c4470 0%,var(--navy) 46%,#0a1c2e 100%)
}
.login-card{
  width:min(408px,100%);background:#fff;border-radius:16px;padding:22px 22px 18px;
  box-shadow:0 30px 70px rgba(3,14,25,.45);border:1px solid rgba(255,255,255,.6)
}
.login-card{border-top:3px solid var(--brand-red)}
.login-card .lg-brand{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.login-card .lg-brand svg{flex:0 0 54px;color:var(--navy)}
.login-card h1{font-size:19px;letter-spacing:.2px}
.login-card .lg-sub{font-size:12.5px;color:var(--navy);font-weight:650}
.login-card .lg-sub2{font-size:11.5px;color:var(--slate-2)}
.login-card .field{margin-bottom:11px}
.login-card .btn{width:100%;justify-content:center;padding:10px;font-size:14px}
.demo-creds{margin-top:14px;border-top:1px dashed var(--line);padding-top:11px}
.demo-creds table{width:100%;border-collapse:collapse;font-size:11.5px}
.demo-creds td{padding:3px 4px;border-bottom:1px solid var(--line-2)}
.demo-creds td:last-child{text-align:end}
.demo-creds button{
  font:inherit;font-size:11.5px;background:var(--grey-bg);border:1px solid var(--line);
  border-radius:6px;padding:2px 7px;cursor:pointer;color:var(--navy);font-weight:650
}
.demo-creds button:hover{background:#e2e9f1}
.login-top{display:flex;justify-content:flex-end;margin-bottom:6px}

/* ==========================================================================
   11. CHARTS
   ========================================================================== */
.chart{display:block;width:100%;height:auto;overflow:visible;font-family:var(--font)}
.chart text{fill:var(--slate-2);font-size:10.5px}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .gridline{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 3}
.chart .barrect{transition:opacity .12s}
.chart .barrect:hover{opacity:.82}
.chart .lbl{fill:var(--slate);font-size:10.5px;font-weight:600}
.chart .val{fill:var(--navy);font-size:10.5px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:var(--slate-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:5px;vertical-align:-1px}
.kpi .vv,.num,.chart text{unicode-bidi:isolate}

/* ==========================================================================
   12. README DOC STYLES
   ========================================================================== */
.doc{max-width:1020px}
.doc h2{margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);font-size:16px}
.doc h3{margin:15px 0 6px;font-size:13.5px;color:var(--slate)}
.doc ol,.doc ul{font-size:13px}
.doc ol.steps{padding-inline-start:0;list-style:none;counter-reset:s}
.doc ol.steps > li{
  counter-increment:s;position:relative;padding-inline-start:32px;margin:0 0 8px
}
.doc ol.steps > li::before{
  content:counter(s);position:absolute;inset-inline-start:0;top:-1px;
  width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;
  font-size:11.5px;font-weight:700;display:grid;place-items:center
}
.legend-tbl{width:100%;max-width:600px;border-collapse:collapse;font-size:12.5px}
.legend-tbl th,.legend-tbl td{border:1px solid var(--line);padding:6px 9px;text-align:start}
.legend-tbl th{background:var(--grey-bg);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate-2)}
.kbd-hint{font-size:11.5px;color:var(--slate-3)}
pre.code{
  background:#1B1D47;color:#dbe6f1;padding:11px 13px;border-radius:10px;overflow:auto;
  font-family:var(--mono);font-size:11.5px;line-height:1.55;margin:0 0 12px
}
pre.code b{color:#7dd3c8}

/* ==========================================================================
   13. RTL + RESPONSIVE
   ========================================================================== */
[dir="rtl"] .sidebar{border-inline-end:0;border-inline-start:1px solid #15173c}
[dir="rtl"] .num,[dir="rtl"] .tbl .num{text-align:left}
[dir="rtl"] #toastHost{--x:1}
[dir="rtl"] .tbl th,[dir="rtl"] .tbl td{text-align:right}
@media (max-width:980px){
  :root{--sidebar-w:64px}
  .sidebar .brand b,.sidebar .brand span,.nav-label,.nav button .tx2,.sidebar-foot{display:none}
  .nav button{justify-content:center;padding:11px 4px}
  .nav button .cnt{position:absolute;margin:0;inset-block-start:2px;inset-inline-end:5px;font-size:9px;padding:0 4px}
  .nav button{position:relative}
  main.content{padding:12px}
}
@media (max-width:640px){
  .topbar{padding:0 10px}
  .topbar .crumb span{display:none}
  .who .nm2,.who .rl{display:none}
}

/* ==========================================================================
   14. PRINT
   ========================================================================== */
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{background:#fff !important;font-size:10.5pt}
  .sidebar,.topbar,#toastHost,.no-print,.overlay{display:none !important}
  main.content{padding:0}
  .card{box-shadow:none;border:1px solid #ccd5df;break-inside:avoid;margin-bottom:9px}
  .tbl-wrap{max-height:none;overflow:visible;border:1px solid #ccd5df}
  .tbl thead th{background:#222457 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;position:static}
  .tbl tbody tr:nth-child(even){background:#f4f6f9 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .chip,.st-oos,.flag,.grade-A,.grade-B,.grade-C,.grade-D,.kpi{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .chart{max-width:100%}
  #printArea{display:block}
  #printArea .p-head{display:flex;align-items:center;gap:9px;border-bottom:1.6pt solid #222457;padding-bottom:2mm;margin-bottom:2.5mm}
#printArea .p-head svg{flex:0 0 30px;color:#222457}
#printArea .p-co{font-size:12.5pt;font-weight:700;letter-spacing:.4px;color:#222457}
#printArea .p-tag{font-size:7.5pt;color:#5a6a7d;letter-spacing:1.1px;text-transform:uppercase}
#printArea h1{font-size:14pt;margin-bottom:2mm}
  #printArea table{width:100%;border-collapse:collapse;font-size:9pt}
  #printArea th,#printArea td{border:1px solid #98a4b3;padding:2.5px 4px;text-align:start}
  #printArea th{background:#e6ebf1}
  #printArea .p-meta{font-size:9pt;color:#333;margin-bottom:3mm}
  .print-only{display:block !important}
}
.print-only{display:none}

  'doc.howto':['How to use — 7 steps','طريقة الاستخدام — 7 خطوات'],
  'howto.1t':['Add warehouses','أضف المستودعات'],
  'howto.1b':['Masters → Warehouses → Add Warehouse. Five fields: name (EN + AR), location, manager, capacity in rolls. Capacity drives the utilisation gauge on the dashboard and in Reports.','من البيانات الأساسية → المستودعات → إضافة مستودع: الاسم بالعربي والإنجليزي، الموقع، المسؤول، والسعة باللفافات. السعة تحسب نسبة الإشغال في اللوحة والتقارير.'],
  'howto.2t':['Add fabrics','أضف الأقمشة'],
  'howto.2b':['Masters → Fabrics → Add Fabric: composition, GSM, meters-per-roll, default grade. meters-per-roll is what turns rolls into total metres automatically — you never type metres.','البيانات الأساسية → الأقمشة → إضافة قماش: التركيب، الجرام/م2، الأمتار لكل لفافة، والدرجة الافتراضية. الأمتار لكل لفافة هي ما يحوّل اللفافات إلى أمتار تلقائياً.'],
  'howto.3t':['Add colors / grades','أضف الألوان والدرجات'],
  'howto.3b':['Masters → Colors → Add Color, or press "Load full color catalog" to seed all 46 market colours with Arabic names, hex codes and grades A–D in one click. Grade A = premium/core, B = standard, C = fashion/seasonal, D = clearance/seconds.','من الألوان أضف لوناً يدوياً أو اضغط "تحميل كتالوج الألوان كاملاً" لإدخال 46 لوناً سوقياً بأسمائها العربية وأكواد HEX ودرجاتها A–D. الدرجة A أساسي/ممتاز، B قياسي، C موضة/موسمي، D تصفية/ثانية.'],
  'howto.4t':['Map them','اربط المستودع بالقماش واللون'],
  'howto.4b':['Masters → Mapping → Add Mapping Row: pick warehouse → fabric → color from the dependent dropdowns, set min rolls, max rolls and lead time. Duplicate combinations are blocked. ONLY mapped combinations can be used in Inventory and Movements, and deactivating a row hides it from every dropdown without deleting history.','البيانات الأساسية → الربط → إضافة صف: اختر المستودع ثم القماش ثم اللون، وحدد الحد الأدنى والأقصى ومدة التوريد. التكرار ممنوع. لا يمكن استخدام تركيبة في المخزون أو الحركات إلا إذا كانت مربوطة، وإيقاف صف يخفيه من القوائم دون حذف التاريخ.'],
  'howto.5t':['Record inventory','سجّل المخزون'],
  'howto.5b':['Inventory → New record: choose warehouse → fabric → color, then type opening / in / out rolls and the unit cost per roll. Closing rolls, total metres, total value, status and the reorder suggestion are all calculated — no totals to type.','المخزون → سجل جديد: اختر المستودع ثم القماش ثم اللون، وأدخل الرصيد الافتتاحي والوارد والصادر وتكلفة اللفافة. الرصيد الختامي والأمتار والقيمة والحالة واقتراح إعادة الطلب كلها محسوبة.'],
  'howto.6t':['Log movements','سجّل الحركات'],
  'howto.6b':['Movements → In / Out / Transfer / Adjustment. A transfer needs both warehouses and is added to one and subtracted from the other inside getStock(). Adjustments accept negative quantities for shrinkage. Movements are combined with inventory rows — never record the same physical movement in both places.','الحركات → وارد/صادر/تحويل/تسوية. التحويل يحتاج مستودعين فيُضاف لأحدهما ويُخصم من الآخر داخل getStock(). التسويات تقبل قيماً سالبة للنقص. الحركات تُدمج مع سجلات المخزون — لا تسجّل نفس الحركة في المكانين.'],
  'howto.7t':['Read the dashboard','اقرأ لوحة المؤشرات'],
  'howto.8t':['Re-brand without touching the code','غيّر الهوية دون لمس الكود'],
  'howto.8b':['The company name in Settings is what the sidebar, the browser tab, the in-app README and the printed letterhead all read — rename the company there and every one of those follows. The mark itself is a single inline <symbol id="azt-mark"> in the HTML; it is drawn with plain paths (no fonts, no images), and logo.svg beside index.html is the same geometry for the repo, README badges and favicons.','اسم الشركة في الإعدادات هو ما يقرأه الشريط الجانبي وعنوان التبويب وملف README المطبوع — غيّره هناك فتتبعه كل المواضع. العلامة نفسها <symbol id="azt-mark"> واحدة مرسومة بمسارات فقط (بدون خط أو صور)، وملف logo.svg بجانب index.html هو نفس الرسم للمستودع وشارات README والأيقونات.'],
  'howto.7b':['Dashboard: seven live KPIs, rolls by warehouse, fabric mix, grade donut, stock trend (day/week/month), Top 10 movers and "Reorder now". Everything reacts to the filters and to your warehouse scope — keepers only ever see their own warehouses.','لوحة المؤشرات: 7 مؤشرات حية، اللفافات لكل مستودع، توزيع الأقمشة، دائرة الدرجات، منحنى المخزون (يومي/أسبوعي/شهري)، أكثر 10 حركة، وجدول "اطلب الآن". كل شيء يتبع المرشحات ونطاق المستخدم.'],
  'doc.legendNote':['These four classes come from computeStatus(); the two warning classes come from the validation flags.','هذه الحالات الأربع من computeStatus() وتحذيراتها من أعلام التحقق.'],
  'doc.troubleNote':['Open Settings → Run diagnostics to have the app check these for you automatically.','افتح الإعدادات → تشغيل الفحص ليقوم النظام بالتحقق نيابة عنك.'],
  'doc.roleNote':['Enforced by can(user, action, warehouseId). Buttons are not rendered when the role cannot use them, AND the write path re-checks — hiding is UX, the check is security.','منظّمة بـ can(user, action, warehouseId). لا تُرسم الأزرار إن لم يسمح الدور، وطريق الحفظ يعيد التحقق — الإخفاء للراحة والتحقق هو الأمان.'],
  'trouble.1b':['Symptom: a "storage is blocked" banner appears and nothing survives a reload. Firefox/Safari treat each file:// document as an opaque origin and localStorage throws. Fix: serve the folder over http (python3 -m http.server) or just accept session-only mode; on GitHub Pages over https localStorage always works. The app degrades to in-memory storage instead of crashing, and Export JSON still gives you a durable file.','العَرَض: تظهر رسالة أن التخزين محظور ولا يُحفظ شيء بعد إعادة التحميل. بعض المتصفحات تمنع التخزين لملفات file://. الحل: شغّل مجلد التطبيق عبر http (python3 -m http.server) أو اقبل الوضع المؤقت. على GitHub Pages يعمل التخزين بشكل طبيعي، وتصدير JSON يعطيك ملفاً دائماً.'],
  'trouble.2b':['Symptom: you edited index.html (or the seed) and the old data is still on screen. That is expected — localStorage is the source of truth, the seed only runs when the stored key is missing. Fix: Settings → Danger zone → "Reset to sample data" (a JSON backup is downloaded first), or clear the key fabric-inventory-state-v1 in DevTools → Application → Local Storage, then hard-reload (Ctrl+Shift+R / Cmd+Shift+R).','العَرَض: بعد تعديل الملف لا تزال البيانات القديمة ظاهرة. هذا طبيعي لأن التخزين المحلي هو المصدر، والبيانات التجريبية تُحمَّل فقط عند غياب المفتاح. الحل: الإعدادات → استعادة البيانات التجريبية، أو احذف المفتاح fabric-inventory-state-v1 من DevTools ثم أعد التحميل القوي.'],
  'trouble.3b':['Every entity uses a stable slug/serial id (wh-north, fab-poplin, col-navy, inv-0001) generated by nextId(); the id is never shown in a table where it could be re-typed. Two rows with the same id corrupt lookups silently, so ids are auto-assigned and duplicates in the human layer are blocked by a real check: mapping rows with the same warehouse+fabric+color triple are refused on save and flagged DUPLICATE in the grid (one demo duplicate is seeded so you can see the flag).','كل كيان له معرّف ثابت يولّده nextId() ولا يُعرض في جدول قابل لإعادة الإدخال. تكرار المعرّف يُفسد البحث بصمت، لذلك تُمنع التكرارات عند الحفظ ويظهر علم DUPLICATE في جدول الربط ( يوجد صف مكرر تجريبي لعلم الحالة ).'],
  'trouble.4b':['new Date("2026-11-07") is parsed as UTC midnight, so in a negative UTC offset it becomes the 6th. parseISO() in this app always builds a LOCAL date from the y/m/d parts, and dates are stored as plain yyyy-mm-dd strings (never Date objects, never timestamps) so exports, sorting and the between-filter are stable in every timezone. Do not paste "07/11/2026" into a date field — the input is type=date and the model is ISO.','يُفسَّر تاريخ ISO كـ UTC وقد يتغيّر اليوم حسب المنطقة. لذلك يبني parseISO() تاريخاً محلياً وتُخزَّن التواريخ كنص yyyy-mm-dd فقط، مما يجعل الترتيب والمرشحات والتصدير ثابتة في كل المناطق الزمنية. لا تدخل 07/11/2026 يدوياً.'],
  'trouble.5b':['input.value is always a string: "" for an empty number field, "12" for a filled one. Every numeric read goes through num()/intNum(), which coerces, strips thousands separators and returns a defined default instead of NaN — that is why no cell can ever print NaN. Number inputs also carry step/min so browsers block letters early.','قيمة الإدخال نص دائماً: "" للفراغ و"12" للرقم. كل قراءة رقمية تمر على num()/intNum() التي تحوّل النص إلى رقم وترجع بديلاً محدداً بدل NaN، لهذا لا تظهر NaN في أي خانة.'],
  'trouble.6b':['The #1 accounting risk in this schema: inventory rows hold rollsIn/rollsOut AND movements hold In/Out rows, and getStock() sums both by design. So log each physical event in ONE place. Transfers are the other trap: a single Transfer row touches two warehouses (+to, −from); it must never be entered as an Out on one side plus an In on the other, or the total rolls in the company double. The Inventory form states this under the in/out fields.','أهم خطر محاسبي: صفوف المخزون تحتوي وارد/صادر وصفوف الحركات تحتويهما أيضاً، و getStock() يجمعهما. لذا سجّل كل حركة في مكان واحد. الفخ الثاني: التحويل يمس مستودعين (+ للوجهة − للمصدر) ولا يجوز تسجيله كصادر في طرف ووارد في طرف آخر وإلا ضاعفت رصيد الشركة.'],
  'trouble.7b':['Deleting a warehouse used to be able to strand inventory rows that still point at it. Prevention: deletes are refused while children reference the row (the dialog tells you how many) and Deactivate is offered instead — that hides it from every dropdown without losing history. Detection: Settings → Run diagnostics lists orphaned inventory/movement/mapping rows, and any row that still points at a missing master shows "⚠ Invalid combination" in red, exactly like an unmapped combination.','الحذف قد يترك صفوف مخزون تشير لمستودع غير موجود. المنع: يرفض النظام الحذف ما دامت هناك سجلات مرتبطة ويعرض بدلاً منه الإيقاف المؤقت. والتحقق: إعدادات → تشغيل الفحص يعرض الصفوف اليتيمة، وأي صف يشير لبيانات محذوفة يظهر عليه "⚠ تركيبة غير صالحة" بالأحمر.'],
  'trouble.8b':['Bare join(",") corrupts Arabic names and any note containing a comma or quote. rowsToCsv() always quotes when a value contains a comma, quote, CR or LF and doubles inner quotes, and every file is written with a UTF-8 BOM so Excel does not render Arabic as Ù…Ø¬Ø±Ø¯ÙŠ. Values starting with = + - @ are prefixed with an apostrophe so Excel will not evaluate them as formulas.','الدمج بفاصلة فقط يُفسد الأسماء العربية والملاحظات. تضيف دالة التصدير علامات التنصيص عند الحاجة وتُضاعف علامات الاقتباس، وتكتب ملف UTF-8 مع BOM ليقرأه Excel بشكل صحيح، وتسبق القيم التي تبدأ بـ = + - @ بفاصلة عليا لمنع تنفيذها كصيغ.'],
  'trouble.9b':['Rolls are integers, metres and money are not. The rule set: quantities "#,##0", metres "#,##0.00 m", money currency + "#,##0.00" via fmtMoney() — one formatter per concept, called by the table renderer, the KPI cards, the charts and the CSV writer, so a number can never look different in two places. Reorder suggestions round UP (you never order a fraction of a roll) and only when settings.enableRounding is on.','اللفافات أعداد صحيحة والأمتار والأموال لا. القاعدة: الكميات "#,##0" والأمتار "#,##0.00 m" والمبالغ بالعملة "#,##0.00" عبر منسّق واحد تستدعيه الجداول والبطاقات والرسوم وتصدير CSV، فلا يختلف شكل الرقم بين مكانين. وتقريب إعادة الطلب لأعلى فقط عند تفعيل خيار التقريب.'],
  'trouble.10b':['Charts are pure inline SVG produced during renderActive() from the same filter object as the KPI cards, and the filter controls call renderActive() on every change — there is no chart instance to keep in sync and nothing to destroy. If you ever add a chart, put it inside the render function of the view (not in a one-time init), otherwise it will paint once and freeze. Also do not cache filter results outside STATE — the derived rows are rebuilt because commit() bumps a revision that invalidates the stock index.','الرسوم SVG تُبنى داخل renderActive() من نفس كائن المرشحات، وأي تغيير في المرشح يستدعي إعادة الرسم، فلا يوجد رسم يجب تحديثه يدوياً. إن أضفت رسماً جديداً فضعه داخل دالة الرسم الخاصة بالشاشة وليس في التهيئة الأولى وإلا تجمّد.'],
  'doc.legend':['Color legend','دليل الألوان'],
  'doc.security':['Security note — read before real use','ملاحظة أمنية — اقرأها قبل الاستخدام الفعلي'],
  'doc.securityBody':['Client-side RBAC is NOT tamper-proof. A determined user can bypass role restrictions via DevTools. This design is intended for a small trusted team. For production, move to a real backend or serverless identity provider. Passwords in this demo are obfuscated with btoa only — real deployments MUST hash passwords on a server.','التحكم بالأدوار من جهة العميل ليس محصّناً. يستطيع المستخدم العنيد تجاوزه عبر أدوات المطور. هذا التصميم مخصص لفريق صغير موثوق. للإنتاج استخدم خلفية حقيقية أو مزوّد هوية. كلمات المرور هنا مشفّرة بـ btoa للعرض فقط — ويجب تشفيرها على خادم في الإنتاج.'],
  'doc.deploy':['GitHub Pages deploy checklist','قائمة نشر GitHub Pages'],
  'deploy.1':['Create a new public or private repository (e.g. fabric-inventory).','أنشئ مستودعاً جديداً (مثلاً fabric-inventory).'],

function attemptLogin(username, password) {
  var now = Date.now();
  if (LOGIN_FAILS.until > now) {
    var left = Math.ceil((LOGIN_FAILS.until - now) / 1000);
    showLoginError(t('login.locked', { s: left }));
    writeAudit({ action: 'Blocked', table: 'auth', recordId: username || '(empty)', field: 'login', oldValue: 'locked', newValue: left + 's' });
    return false;
  }
  if (!username || !password) { showLoginError(t('login.empty')); return false; }
  var u = findUser(username);
  /* A wrong password and an unknown account answer with the SAME words, so the
     screen never confirms whether a username exists. "Deactivated" is only ever
     shown to someone who already knows the password. */
  var pwOk = !!(u && dec(u.passwordEncoded) === String(password));
  if (!u || !pwOk) {
    LOGIN_FAILS.n++;
    if (LOGIN_FAILS.n >= CONFIG.LOGIN_MAX_FAILS) { LOGIN_FAILS.until = now + CONFIG.LOGIN_LOCK_MS; LOGIN_FAILS.n = 0; }
    showLoginError(t('login.bad'));
    writeAudit({ action: 'Blocked', table: 'auth', recordId: String(username).slice(0, 40), field: 'login', oldValue: 'failed', newValue: 'denied' });
    return false;
  }
  if (u.isActive !== 'Y') { showLoginError(t('login.deact')); return false; }
  LOGIN_FAILS.n = 0; LOGIN_FAILS.until = 0;
  startSession(u);
  return true;
}

  };
  var tok = randToken();
  STORAGE.set(APP.sessionKey, JSON.stringify({ token: tok, userId: user.userId, loginAt: new Date().toISOString() }));
  STATE.settings.currentUser = user.userId;               /* mirrored into settings per the schema */
  writeAudit({ action: 'Login', table: 'auth', recordId: user.username, field: 'session', oldValue: '', newValue: user.role + ' · ' + (user.role === 'WarehouseKeeper' ? (user.warehouseIds || []).length + ' wh' : 'all') });

  if (!raw) return false;
  var s = null;
  try { s = JSON.parse(raw); } catch (e) { return false; }
  if (!s || !s.token || !s.userId) return false;
  var born = Date.parse(s.loginAt || 0) || 0;
  if (Date.now() - born > CONFIG.SESSION_TTL_HOURS * 3600 * 1000) {
    STORAGE.del(APP.sessionKey);
    toast('warn', t('msg.sessionExpired'));
    return false;
  }
  var u = lookupUser(s.userId) || (STATE.users || []).filter(function (x) { return x.userId === s.userId; })[0];
  if (!u) { STORAGE.del(APP.sessionKey); return false; }

function stampFileName(prefix, ext) {
  var d = new Date();
  return prefix + '-' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + '.' + ext;
}
function downloadText(filename, text, mime) {
  mime = mime || 'application/octet-stream';
  try {
    var blob = new Blob(['\ufeff' + text], { type: mime + ';charset=utf-8' });   /* BOM → Excel reads Arabic */
    var url = URL.createObjectURL(blob);
    var a = mk('a', { href: url, download: filename, style: 'display:none' });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); try { URL.revokeObjectURL(url); } catch (e) { /* ignore */ } }, 500);
    return true;
  } catch (e) {
    return exportFallback(filename, text);
  }
}
/* PITFALL: some hardened file:// contexts refuse blob downloads → let the user
   copy the content instead of silently failing. */
function exportFallback(filename, text) {
  var ta = mk('textarea', { style: 'width:100%;height:230px;font-family:var(--mono);font-size:11.5px', readonly: true });
  ta.value = text;
  confirmModal({
    title: t('msg.exportFail'), danger: false, okLabel: t('btn.download'),
    body: mk('div', null, [mk('p', { class: 'tiny muted' }, filename), ta]),
    onOk: function () { downloadText(filename, text, 'text/plain'); }
  });
  setTimeout(function () { try { ta.select(); } catch (e) { /* ignore */ } }, 60);
  return false;
}
function rowsToCsv(head, rows) {

  rows.forEach(function (r) { lines.push(r.map(escapeCsv).join(',')); });
  return lines.join('\r\n');
}
function exportCsv(spec, filenameStub) {
  var data = spec();
  if (!data.rows.length) { toast('warn', t('msg.noExportRows')); return; }
  var csv = rowsToCsv(data.head, data.rows);
  var name = stampFileName(filenameStub || data.name, 'csv');
  downloadText(name, csv, 'text/csv');
  toast('ok', t('msg.exportOk', { n: fmtNum(data.rows.length) }), name);
  writeAudit({ action: 'Export', table: data.name, recordId: name, field: 'csv', oldValue: '', newValue: data.rows.length + ' rows' });
}

    schemaVersion: APP.schemaVersion, state: STATE

function importJsonFile(file) {
  var fr = new FileReader();
  fr.onerror = function () { toast('err', t('msg.importBad', { name: APP.name })); };
  fr.onload = function () {
    var parsed = null;
    try { parsed = JSON.parse(String(fr.result)); } catch (e) { toast('err', t('msg.importBad', { name: APP.name }) + ' — ' + e.message); return; }
    var st = parsed && parsed.state ? parsed.state : parsed;
    var problems = validateImport(st);
    if (problems.length) { toast('err', t('msg.importBad', { name: APP.name }) + ': ' + problems.join(', ')); return; }
    confirmModal({
      title: t('btn.import'), danger: true, okLabel: t('btn.import'), body: mk('div', null, [
        mk('p', null, t('msg.importWarnBody')),
        mk('p', { class: 'tiny muted mb0' }, (st.warehouses || []).length + ' ' + t('f.warehouses') + ' · ' + (st.inventory || []).length + ' ' + t('nav.inventory') + ' · ' + (st.movements || []).length + ' ' + t('nav.movements') +
          (parsed.app ? ' · from ' + parsed.app + ' v' + parsed.version : ''))
      ]),
      onOk: function () {
        exportJson();                                     /* backup the outgoing state too */
        var lang = STATE.settings.language;
        STATE = st;
        STATE.settings.language = lang;
        if (!Array.isArray(STATE.auditLog)) STATE.auditLog = [];
        writeAudit({ action: 'Import', table: 'backup', recordId: file.name, field: 'state', oldValue: 'replaced', newValue: countRecords() + ' records' });
        commit();
        buildShell();
        setLanguage(lang, { save: true });
        toast('ok', t('msg.importOk', { n: fmtNum(countRecords()) }));
        renderActive();
      }
    });
  };
  fr.readAsText(file);
}
function validateImport(st) {
  var p = [];
  if (!st || typeof st !== 'object') { return ['not an object']; }
  if (!st.settings || typeof st.settings !== 'object') p.push('settings');
  ['users', 'warehouses', 'fabrics', 'colors', 'mapping', 'inventory', 'movements'].forEach(function (k) {
    if (!Array.isArray(st[k])) p.push(k + '[]');
  });
  if (Array.isArray(st.users) && !st.users.some(function (u) { return u && u.username && u.passwordEncoded && u.role; })) p.push('users[].username/passwordEncoded/role');
  if (Array.isArray(st.warehouses) && st.warehouses.some(function (w) { return !w || !w.warehouseId; })) p.push('warehouses[].warehouseId');
  if (Array.isArray(st.inventory) && st.inventory.some(function (r) { return !r || !r.recordId; })) p.push('inventory[].recordId');
  if (Array.isArray(st.mapping) && st.mapping.some(function (r) { return !r || !r.warehouseId || !r.fabricId || !r.colorId; })) p.push('mapping[] keys');
  return p;
}

function runDiagnostics() {
  ensureIdx();
  var out = [], seen = {}, i;
  function add(sev, key, msg, ids) {
    var k = key + '|' + msg;
    if (seen[k]) return;
    seen[k] = 1;
    out.push({ sev: sev, title: key, msg: msg, ids: ids || '' });
  }
  /* 1. duplicate mapping triples */
  var grouped = {};
  STATE.mapping.forEach(function (m) {
    var k = m.warehouseId + '|' + m.fabricId + '|' + m.colorId;
    (grouped[k] || (grouped[k] = [])).push(m.mappingId);
  });
  Object.keys(grouped).forEach(function (k) {
    if (grouped[k].length > 1) add('err', 'mas.dupWarn', 'DUPLICATE · ' + comboLabel(k.split('|')[0], k.split('|')[1], k.split('|')[2]) + ' → ' + grouped[k].join(', '), grouped[k].join(','));
  });
  /* 2. min >= max */
  STATE.mapping.forEach(function (m) {
    if (num(m.minRolls) >= num(m.maxRolls)) add('warn', 'f.min', m.mappingId + ': ' + t('f.min') + ' ' + fmtNum(m.minRolls) + ' \u2265 ' + t('f.max') + ' ' + fmtNum(m.maxRolls), m.mappingId);
  });
  /* 3. orphans / invalid combos in inventory */
  STATE.inventory.forEach(function (r) {
    if (!lookupWarehouse(r.warehouseId)) add('err', 'f.warehouse', r.recordId + ' → ' + (r.warehouseId || '(empty)'), r.recordId);
    if (!lookupFabric(r.fabricId)) add('err', 'f.fabric', r.recordId + ' → ' + (r.fabricId || '(empty)'), r.recordId);
    if (!lookupColor(r.colorId)) add('err', 'f.color', r.recordId + ' → ' + (r.colorId || '(empty)'), r.recordId);
    var mp = getMappingRow(r.warehouseId, r.fabricId, r.colorId);
    if (!mp) add('err', 'msg.invalidCombo', r.recordId + ': ' + comboLabel(r.warehouseId, r.fabricId, r.colorId), r.recordId);
    else if (mp.isActive !== 'Y') add('warn', 'mas.inactive', r.recordId + ': ' + comboLabel(r.warehouseId, r.fabricId, r.colorId), r.recordId);
    var closing = num(r.openingRolls) + num(r.rollsIn) - num(r.rollsOut);
    if (closing < 0) add('warn', 'f.closing', r.recordId + ': ' + fmtNum(closing), r.recordId);
    if (!isNumish(r.unitCostPerRoll) || num(r.unitCostPerRoll) <= 0) add('warn', 'f.unitCost', r.recordId, r.recordId);
  });
  /* 4. movement validity */
  STATE.movements.forEach(function (m) {
    var w = m.toWarehouseId || m.fromWarehouseId;
    if (m.type === 'Transfer' && m.fromWarehouseId && m.fromWarehouseId === m.toWarehouseId) add('err', 'msg.sameWh', m.movementId, m.movementId);
    if (m.type === 'Transfer' && (!m.fromWarehouseId || !m.toWarehouseId)) add('err', 'f.to', m.movementId, m.movementId);
    if (!isValidCombination(m.type === 'In' ? m.toWarehouseId : (m.type === 'Transfer' ? m.toWarehouseId : m.fromWarehouseId), m.fabricId, m.colorId)) {
      add('warn', 'msg.invalidCombo', m.movementId + ': ' + comboLabel(w, m.fabricId, m.colorId), m.movementId);
    }
    if (!num(m.rolls)) add('err', 'msg.qtyNonZero', m.movementId, m.movementId);
    if (!m.date || !parseISO(m.date)) add('err', 'f.date', m.movementId + ' → ' + m.date, m.movementId);
  });
  /* 5. masters hygiene */
  ['fabrics', 'colors', 'warehouses'].forEach(function (list) {
    var idk = list === 'fabrics' ? 'fabricId' : list === 'colors' ? 'colorId' : 'warehouseId';
    var seen2 = {};
    STATE[list].forEach(function (r) {
      if (seen2[r[idk]]) add('err', 'f.recordId', list + ' → ' + r[idk] + ' ' + (langIsAr() ? 'مكرر' : 'appears twice'), r[idk]);
      seen2[r[idk]] = 1;
      if (!r[list === 'fabrics' ? 'fabricName' : list === 'colors' ? 'colorName' : 'warehouseName']) add('warn', 'f.nameEn', list + ' ' + r[idk], r[idk]);
      if (!(langIsAr() ? r[[list === 'fabrics' ? 'fabricNameAr' : list === 'colors' ? 'colorNameAr' : 'warehouseNameAr']] : true)) add('warn', 'f.nameAr', list + ' ' + r[idk], r[idk]);
    });
  });
  var seenU = {};
  STATE.users.forEach(function (u) {
    var k = String(u.username).toLowerCase();
    if (seenU[k]) add('err', 'f.username', u.username, u.userId);
    seenU[k] = 1;
    if (u.role === 'WarehouseKeeper' && !(u.warehouseIds || []).length) add('warn', 'f.scope', u.username, u.userId);
  });
  /* 6. warehouse capacity vs live rolls */
  getStockByWarehouse(CURRENT).forEach(function (b) {
    if (b.capacity > 0 && b.rolls > b.capacity) add('warn', 'f.capacity', whName(b.warehouseId) + ': ' + fmtNum(b.rolls) + ' > ' + fmtNum(b.capacity), b.warehouseId);
    if (!b.capacity) add('warn', 'f.capacity', whName(b.warehouseId) + ' = 0', b.warehouseId);
  });
  return out;
}

/* ============================================================================
   ██  SECTION 25 — SHARED CRUD HELPERS (deactivate, orphan-safe delete)
   ==========================================================================*/
function referencesOf(kind, id) {
  var c = {};
  if (kind === 'warehouse') {
    c.mapping = STATE.mapping.filter(function (m) { return m.warehouseId === id; }).length;
    c.inventory = STATE.inventory.filter(function (r) { return r.warehouseId === id; }).length;
    c.movements = STATE.movements.filter(function (m) { return m.fromWarehouseId === id || m.toWarehouseId === id; }).length;
  } else if (kind === 'fabric') {
    c.mapping = STATE.mapping.filter(function (m) { return m.fabricId === id; }).length;
    c.inventory = STATE.inventory.filter(function (r) { return r.fabricId === id; }).length;
    c.movements = STATE.movements.filter(function (m) { return m.fabricId === id; }).length;
  } else if (kind === 'color') {
    c.mapping = STATE.mapping.filter(function (m) { return m.colorId === id; }).length;
    c.inventory = STATE.inventory.filter(function (r) { return r.colorId === id; }).length;
    c.movements = STATE.movements.filter(function (m) { return m.colorId === id; }).length;
  }
  c.total = (c.mapping || 0) + (c.inventory || 0) + (c.movements || 0);
  return c;
}

/* Ids are generated (never typed) so two rows can never collide — pitfall #3. */
function uniqueId(prefix, wanted, listKey, idField) {
  var base = wanted || (prefix + '-' + Date.now().toString(36)), id = base, n = 2;
  var exists = function (v) { return STATE[listKey].some(function (r) { return r[idField] === v; }); };
  while (exists(id)) { id = base + '-' + n; n++; }
  return id;
}

function loadColorCatalog() {
  if (!guard('editColor', null, { table: 'colors' })) return;
  var added = 0, repaired = 0;
  COLOR_CATALOG.forEach(function (row) {
    var exist = lookupColor(row[0]);
    if (!exist) {
      STATE.colors.push({ colorId: row[0], colorName: row[1], colorNameAr: row[2], hexCode: row[3], gradeCode: row[4], gradeRank: GRADE_RANK[row[4]], isActive: 'Y' });
      added++;
    } else {
      var changed = false;
      if (!exist.colorNameAr && row[2]) { exist.colorNameAr = row[2]; changed = true; }
      if (!exist.hexCode && row[3]) { exist.hexCode = row[3]; changed = true; }
      if (!exist.gradeCode && row[4]) { exist.gradeCode = row[4]; changed = true; }
      if (changed) repaired++;
    }
  });
  if (!added && !repaired) { toast('info', t('catalogAll')); return; }
  writeAudit({ action: 'Create', table: 'colors', recordId: 'catalog', field: 'catalog', oldValue: fmtNum(STATE.colors.length - added), newValue: fmtNum(STATE.colors.length) + (repaired ? ' (+' + repaired + ' patched)' : '') });
  commit();
  toast('ok', t('msg.catalogLoaded', { n: fmtNum(added) }));

function movementForm(rec, prefill) {

  if (!guard('editMovements', seed.warehouseId || null, { table: 'movements', recordId: editing ? rec.movementId : 'new' })) return;

  /* "From" is a shed the user manages (scoped). The DESTINATION is deliberately

    { key: 'rolls', labelKey: 'f.qty', type: 'int', required: true, dflt: 10 },
    { key: 'reference', labelKey: 'f.reference', type: 'text', placeholder: 'PO-0000 / SOL-0000 / TR-0000 / ADJ-0000' },
    { key: 'notes', labelKey: 'f.notes', type: 'textarea', span: true, rows: 2 }
  ], editing ? { type: rec.type, date: rec.date, rolls: num(rec.rolls), reference: rec.reference || '', notes: rec.notes || '' }
             : { type: 'In', date: isoToday(), rolls: 10, reference: '', notes: '' });

    else if (type === 'Out') items.push(line(t('f.from'), c.warehouseId, -1));
    else if (type === 'Adjustment') {
      var cur2 = getStock(c.warehouseId, c.fabricId, c.colorId);
      if (c.warehouseId) items.push(mk('div', { class: 'row', style: 'gap:8px;justify-content:space-between' }, [
        mk('span', { class: 'tiny muted' }, t('f.warehouse') + ': ' + whName(c.warehouseId)),
        mk('span', null, [fmtNum(cur2), ' → ', mk('b', null, fmtNum(cur2 + q))])]));
    } else {
      items.push(line(t('f.from'), c.warehouseId, -1));
      items.push(line(t('f.to'), other, +1));
    }
    if (!items.length || !c.fabricId) preview.appendChild(mk('span', { class: 'tiny muted', text: t('msg.selWh') }));
    else items.forEach(function (n) { if (n) preview.appendChild(n); });
    preview.className = 'banner ' + (type === 'Out' || type === 'Transfer' || type === 'Adjustment' ? 'warn' : 'ok');
  }
  ['rolls'].forEach(function (k) { form.ctrls[k].node.addEventListener('input', paintPreview); });

/* ============================================================================
   ██  SECTION 29 — AS-OF STOCK (so a "To date" filter really moves the KPIs)
   ==========================================================================*/
function stockAsOf(w, f, c, toIso, fromIso) {
  var total = 0;
  (STATE.inventory || []).forEach(function (r) {
    if (r.warehouseId !== w || r.fabricId !== f || r.colorId !== c) return;
    if (toIso && r.date > toIso) return;
    if (fromIso && r.date < fromIso) return;
    total += num(r.openingRolls) + num(r.rollsIn) - num(r.rollsOut);
  });
  (STATE.movements || []).forEach(function (m) {
    if (m.fabricId !== f || m.colorId !== c) return;
    if (toIso && m.date > toIso) return;
    if (fromIso && m.date < fromIso) return;
    if (m.type === 'In' && m.toWarehouseId === w) total += num(m.rolls);
    else if (m.type === 'Out' && m.fromWarehouseId === w) total -= num(m.rolls);
    else if (m.type === 'Transfer') {
      if (m.toWarehouseId === w) total += num(m.rolls);
      if (m.fromWarehouseId === w) total -= num(m.rolls);
    } else if (m.type === 'Adjustment' && m.fromWarehouseId === w) total += num(m.rolls);
  });
  return total;
}

      ' · ' + t('f.grade') + '=' + (F.gradeCode || t('f.all')) +
      ' · ' + t('f.dateFrom') + '=' + (F.dateFrom || dayOffset(89)) + ' · ' + t('f.dateTo') + '=' + (F.dateTo || isoToday()),
    t('lbl.scope') + ': ' + getWarehousesForUser(CURRENT).map(function (w) { return nm(w, 'warehouseName'); }).join(', ')
  ], [{ caption: rep.caption, cols: rep.cols, rows: rep.rows, total: rep.totals }]);
  writeAudit({ action: 'Export', table: 'report', recordId: rep.kind, field: 'print', oldValue: '', newValue: rep.rows.length + ' rows' });
}

/* ============================================================================
   ██  SECTION 33 — VIEW: AUDIT LOG
   ==========================================================================*/
function renderAudit(host) {
  var st = UI.aud;
  var actions = ['Login', 'Create', 'Update', 'Delete', 'Blocked', 'Import', 'Export', 'Reset', 'Clear'];
  var tables = uniqueInRows(STATE.auditLog.map(function (l) { return { x: l.table }; }), 'x');
  var actSel = makeSelect({ options: [{ value: '', label: t('aud.filterAct') }].concat(actions.map(function (a) { return { value: a, label: t('act.' + a) }; })), value: st.action, onChange: function (v) { st.action = v; renderActive(); } });
  var tblSel = makeSelect({ options: [{ value: '', label: t('aud.filterTbl') }].concat(tables.map(function (x) { return { value: x, label: x }; })), value: st.table, onChange: function (v) { st.table = v; renderActive(); } });
  var search = mk('input', { type: 'search', value: st.search, placeholder: t('f.search'), style: 'max-width:220px', oninput: debounce(function () { st.search = search.value; renderActive(true); }, 300) });
  var actChip = { Login: 'st-over', Create: 'st-ok', Update: 'st-low', Delete: 'st-oos', Blocked: 'st-oos', Import: 'st-over', Export: 'st-ok', Reset: 'st-low', Clear: 'st-oos' };
  var rows = STATE.auditLog.slice().reverse().filter(function (l) {
    if (st.action && l.action !== st.action) return false;
    if (st.table && l.table !== st.table) return false;
    if (st.search) {
      var q = st.search.toLowerCase();
      if ((l.user + ' ' + l.table + ' ' + l.recordId + ' ' + l.field + ' ' + l.oldValue + ' ' + l.newValue + ' ' + l.action).toLowerCase().indexOf(q) < 0) return false;
    }
    return true;
  });
  var shown = rows.slice(0, 400);
  host.appendChild(mk('div', { class: 'card no-print' }, [
    mk('div', { class: 'row', style: 'gap:9px;align-items:flex-end' }, [
      fPick(t('f.actions'), actSel.node), fPick(t('f.table'), tblSel.node), fPick(t('f.search'), search),
      mk('div', { class: 'spacer', style: 'flex:1 1 auto' }),
      mk('span', { class: 'tiny muted' }, t('misc.showing', { n: fmtNum(shown.length), t: fmtNum(rows.length) })),
      mk('button', { class: 'btn btn-xs', type: 'button', text: t('btn.csv'), onclick: function () { exportCsv(csvSpec('audit'), 'audit-log'); } })
    ])
  ]));
  host.appendChild(mk('div', { class: 'card' }, [
    mk('div', { class: 'card-h' }, [mk('h2', null, '🔎 ' + t('aud.title')), mk('div', { class: 'spacer' }),
      mk('span', { class: 'chip', style: 'background:#eef1f5;color:#334155', text: fmtNum(STATE.auditLog.length) + ' ' + t('f.rows') }),
      mk('button', { class: 'btn btn-xs', type: 'button', text: t('btn.print'), onclick: function () { printAudit(shown); } })]),
    makeTable([
      { key: 'timestamp', labelKey: 'f.timestamp', cell: function (l) { return mk('span', { class: 'nowrap' }, fmtDateTime(l.timestamp)); } },
      { key: 'user', labelKey: 'f.user', cell: function (l) { return mk('b', null, l.user || '—'); } },
      { key: 'action', labelKey: 'f.type', cell: function (l) { return chip(actChip[l.action] || 'st-ok', t('act.' + l.action)); } },
      { key: 'table', labelKey: 'f.table' },
      { key: 'recordId', labelKey: 'f.recordId' },
      { key: 'field', labelKey: 'f.field' },
      { key: 'oldValue', labelKey: 'f.oldValue', cell: function (l) {
          var box = mk('span', { style: 'max-width:190px;display:inline-block;white-space:normal' });
          box.textContent = l.oldValue === '' || l.oldValue === null || l.oldValue === undefined ? '—' : String(l.oldValue);
          return box;
        } },
      { key: 'arrow', label: '→', cell: function () { return mk('span', { class: 'muted', text: '→' }); } },
      { key: 'newValue', labelKey: 'f.newValue', cell: function (l) {
          var box = mk('span', { style: 'max-width:190px;display:inline-block;white-space:normal' });
          box.textContent = l.newValue === '' || l.newValue === null || l.newValue === undefined ? '—' : String(l.newValue);
          return box;
        } }
    ], shown, { compact: true, rowClass: function (l) { return l.action === 'Blocked' ? 'row-invalid' : l.action === 'Delete' ? 'row-inactive' : ''; } }),
    rows.length > shown.length ? mk('p', { class: 'tiny muted mb0', style: 'margin-top:8px' }, langIsAr()
      ? 'يتم عرض أحدث 400 سجل. صدّر CSV لقراءة السجل كاملاً.' : 'Showing the newest 400 entries — export CSV for the complete log.') : null
  ]));
}
function printAudit(rows) {
  printTables(t('page.audit.h') + ' — ' + STATE.settings.companyName, [
    t('rep.generated', { d: fmtDateTime(new Date()), u: CURRENT.displayName, c: t('app.name') + ' v' + APP.version })
  ], [{
    caption: t('aud.title'),
    cols: [
      { key: 'timestamp', labelKey: 'f.timestamp', print: function (l) { return fmtDateTime(l.timestamp); } },
      { key: 'user', labelKey: 'f.user' }, { key: 'action', labelKey: 'f.type' }, { key: 'table', labelKey: 'f.table' },
      { key: 'recordId', labelKey: 'f.recordId' }, { key: 'field', labelKey: 'f.field' },
      { key: 'oldValue', labelKey: 'f.oldValue' }, { key: 'newValue', labelKey: 'f.newValue' }
    ], rows: rows
  }]);
}

/* ============================================================================
   ██  SECTION 34 — BOOT, GLOBAL KEYS, MULTI-TAB SYNC
   ==========================================================================*/
function wireLogin() {
  var form = qs('#loginForm');
  on(form, 'submit', function (e) {
    e.preventDefault();
    var u = qs('#loginUser').value, p = qs('#loginPass').value;
    if (attemptLogin(u, p)) { form.reset(); }
  });
  on(qs('#loginUser'), 'input', function () { qs('#loginErr').className = 'err'; });
  on(qs('#loginPass'), 'input', function () { qs('#loginErr').className = 'err'; });
}
var VIEW_KEYS = { '1': 'readme', '2': 'settings', '3': 'masters', '4': 'inventory', '5': 'movements', '6': 'dashboard', '7': 'reports', '8': 'audit', '9': 'profile' };
function wireGlobalKeys() {
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable)) return;
    if (e.altKey && VIEW_KEYS[e.key]) {
      var v = VIEW_KEYS[e.key];
      if (canView(CURRENT, v)) { e.preventDefault(); go(v); }
      else { toast('warn', t('msg.noPermView')); }
      return;
    }
    if (e.key === 'l' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); toggleLanguage(); }
    if (e.key === 'p' && (e.ctrlKey || e.metaKey)) { /* leave printing to the browser */ }
  });
  /* sidebar arrow-key navigation */
  on(qs('#navList'), 'keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    var btns = qsa('button', e.currentTarget);
    var i = btns.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    btns[(i + (e.key === 'ArrowDown' ? 1 : btns.length - 1)) % btns.length].focus();
  });
}
function wireStorageSync() {
  window.addEventListener('storage', function (e) {
    if (!e || e.key !== APP.stateKey || !CURRENT) return;   /* another tab saved: re-read, re-render */
    loadState();
    if (STATE.settings.language) setLanguage(STATE.settings.language, { save: false });
    renderActive();
    toast('info', langIsAr() ? 'تم تحديث البيانات من تبويب آخر.' : 'Data was updated in another tab — view refreshed.');
  });
}
function boot() {
  var seeded = loadState();
  ensureIdx();
  if (STATE.settings.language) setLanguage(STATE.settings.language, { save: false });
  renderLogin();
  wireLogin();
  wireGlobalKeys();
  wireStorageSync();
  var restored = restoreSession();
  if (restored) { showApp(); }
  else { qs('#app').hidden = true; qs('#loginScreen').hidden = false; }
  if (!STORAGE.available) toast('warn', t('msg.storageBlocked'), t('doc.storage'));
  else if (seeded) toast('ok', langIsAr() ? 'تم تحميل البيانات التجريبية — كلها قابلة للتعديل من الواجهة.' : 'Sample data loaded — every value is editable from the UI.');
  if (window.console && console.info) {
    console.info('%c Al Azhar Tex %c Fabric Roll Inventory v' + APP.version + ' · offline · localStorage:' + STORAGE.mode(),
      'color:#fff;background:#222457;padding:2px 6px;border-radius:4px 0 0 4px;font-weight:700',
      'color:#04241f;background:#14B8A6;padding:2px 6px;border-radius:0 4px 4px 0');
  }
}
/* surface any uncaught error as a banner instead of a silent console failure */
window.addEventListener('error', function (e) {
  try { toast('err', String((e && e.message) || 'error')); } catch (x) { /* ignore */ }
});
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
